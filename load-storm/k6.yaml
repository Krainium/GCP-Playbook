apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-loadtest
  namespace: demo
data:
  loadtest.js: |
    import http from 'k6/http';
    import { sleep } from 'k6';
    export const options = {
      scenarios: {
        storm: {
          executor: 'ramping-vus',
          startVUs: 0,
          stages: [
            { duration: '90s',  target: 60  },
            { duration: '150s', target: 250 },
            { duration: '60s',  target: 0   },
          ],
        },
      },
    };
    export default function () {
      http.get('http://podinfo.demo.svc:9898/');
      sleep(0.1);
    }
---
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: loadstorm
  namespace: demo
spec:
  parallelism: 2
  script:
    configMap:
      name: k6-loadtest
      file: loadtest.js
  arguments: -o experimental-prometheus-rw --tag testid=loadstorm
  runner:
    env:
    - name: K6_PROMETHEUS_RW_SERVER_URL
      value: http://kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/write
    - name: K6_PROMETHEUS_RW_TREND_STATS
      value: "p(95),p(99),avg,max"
    - name: K6_PROMETHEUS_RW_STALE_MARKERS
      value: "true"
    resources:
      requests: {cpu: 100m, memory: 128Mi}
