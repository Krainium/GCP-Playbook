<svg xmlns="http://www.w3.org/2000/svg" width="880" height="180" viewBox="0 0 880 180" role="img" aria-label="Load Storm on GKE">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4285F4"/>
      <stop offset="0.5" stop-color="#34A853"/>
      <stop offset="1" stop-color="#FBBC05"/>
    </linearGradient>
  </defs>
  <rect width="880" height="180" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="7" height="180" rx="3.5" fill="url(#bar)"/>

  <!-- emblem: storm cloud with a rising load curve and a lightning bolt -->
  <g transform="translate(40,44)">
    <g fill="#2b3752">
      <circle cx="30" cy="30" r="16"/><circle cx="52" cy="22" r="20"/><circle cx="74" cy="32" r="14"/>
      <rect x="24" y="30" width="54" height="16" rx="8"/>
    </g>
    <!-- lightning -->
    <path d="M52 40 l-10 22 h9 l-6 20 20 -26 h-9 l7 -16 z" fill="#FBBC05"/>
    <!-- rising curve -->
    <path d="M8 92 L28 82 L46 84 L66 60 L92 48" fill="none" stroke="#34A853" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="150" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="31" font-weight="700" fill="#e8eef7">Load Storm</text>
  <text x="151" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" fill="#9aa7ba">Push the system until it bends and watch every signal on one board.</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="151" y="120" width="84" height="30" rx="15" fill="#3a2a12" stroke="#FBBC05" stroke-width="1.2"/>
    <circle cx="171" cy="135" r="4" fill="#f6cf6a"/>
    <text x="201" y="139.5" fill="#f2d488" text-anchor="middle">k6</text>
    <rect x="245" y="120" width="116" height="30" rx="15" fill="#12305e" stroke="#4285F4" stroke-width="1.2"/>
    <circle cx="265" cy="135" r="4" fill="#8ab4f8"/>
    <text x="307" y="139.5" fill="#a9c7fb" text-anchor="middle">Prometheus</text>
    <rect x="371" y="120" width="96" height="30" rx="15" fill="#123a26" stroke="#34A853" stroke-width="1.2"/>
    <circle cx="391" cy="135" r="4" fill="#7ee2a8"/>
    <text x="427" y="139.5" fill="#93e6b6" text-anchor="middle">Grafana</text>
  </g>
</svg>
