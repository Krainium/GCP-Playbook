<svg xmlns="http://www.w3.org/2000/svg" width="880" height="180" viewBox="0 0 880 180" role="img" aria-label="LLM Inference Observatory">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#76b900"/>
      <stop offset="0.5" stop-color="#34A853"/>
      <stop offset="1" stop-color="#FBBC05"/>
    </linearGradient>
  </defs>
  <rect width="880" height="180" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="7" height="180" rx="3.5" fill="url(#bar)"/>

  <!-- emblem: a GPU die with tokens streaming out and a throughput curve -->
  <g transform="translate(42,52)">
    <rect x="2" y="14" width="70" height="52" rx="6" fill="#101827" stroke="#76b900" stroke-width="2.5"/>
    <rect x="18" y="30" width="38" height="20" rx="3" fill="#182338" stroke="#76b900" stroke-width="1.6"/>
    <g stroke="#76b900" stroke-width="2">
      <line x1="10" y1="8" x2="10" y2="14"/><line x1="26" y1="8" x2="26" y2="14"/><line x1="42" y1="8" x2="42" y2="14"/><line x1="58" y1="8" x2="58" y2="14"/>
      <line x1="10" y1="66" x2="10" y2="72"/><line x1="26" y1="66" x2="26" y2="72"/><line x1="42" y1="66" x2="42" y2="72"/><line x1="58" y1="66" x2="58" y2="72"/>
    </g>
    <!-- token stream -->
    <g fill="#f6cf6a"><circle cx="84" cy="26" r="3"/><circle cx="94" cy="34" r="3"/><circle cx="84" cy="44" r="3"/><circle cx="98" cy="24" r="2.5"/><circle cx="100" cy="46" r="2.5"/></g>
    <path d="M2 92 L22 82 L40 84 L60 62 L88 52" fill="none" stroke="#34A853" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,-6)"/>
  </g>

  <text x="150" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#e8eef7">LLM Inference Observatory</text>
  <text x="151" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" fill="#9aa7ba">Run your own LLM on a GPU and watch tokens fly in mission control.</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="151" y="120" width="66" height="30" rx="15" fill="#1e3a12" stroke="#76b900" stroke-width="1.2"/>
    <circle cx="169" cy="135" r="4" fill="#a6e05a"/>
    <text x="195" y="139.5" fill="#c4ef8f" text-anchor="middle">vLLM</text>
    <rect x="227" y="120" width="120" height="30" rx="15" fill="#12305e" stroke="#4285F4" stroke-width="1.2"/>
    <circle cx="247" cy="135" r="4" fill="#8ab4f8"/>
    <text x="291" y="139.5" fill="#a9c7fb" text-anchor="middle">Prometheus</text>
    <rect x="357" y="120" width="96" height="30" rx="15" fill="#3a2a12" stroke="#FBBC05" stroke-width="1.2"/>
    <circle cx="375" cy="135" r="4" fill="#f6cf6a"/>
    <text x="413" y="139.5" fill="#f2d488" text-anchor="middle">Grafana</text>
  </g>
</svg>
