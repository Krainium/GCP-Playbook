<svg xmlns="http://www.w3.org/2000/svg" width="840" height="220" viewBox="0 0 840 220" role="img" aria-label="Flow from workload activity through Tetragon eBPF to a threat map">
  <defs>
    <style>
      .lbl{font-family:Segoe UI,Helvetica,Arial,sans-serif;fill:#e8eef7;font-weight:600;font-size:14px}
      .sub{font-family:Segoe UI,Helvetica,Arial,sans-serif;fill:#93a1b5;font-size:11.5px}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5b6b86"/>
    </marker>
  </defs>
  <rect width="840" height="220" rx="16" fill="#0d1420"/>

  <!-- node 1: workload activity -->
  <rect x="24" y="76" width="156" height="68" rx="12" fill="#161d2c" stroke="#0e4d6b" stroke-width="1.4"/>
  <g transform="translate(44,100)" fill="none" stroke="#8ab4f8" stroke-width="2">
    <path d="M0 6 h6 M0 12 h6 M0 18 h6" stroke-linecap="round"/><rect x="12" y="2" width="14" height="20" rx="2"/>
  </g>
  <text class="lbl" x="82" y="104">Workload</text>
  <text class="lbl" x="82" y="121">exec, file, net</text>

  <!-- node 2: tetragon eBPF -->
  <rect x="220" y="76" width="156" height="68" rx="12" fill="#161d2c" stroke="#5a1f22" stroke-width="1.4"/>
  <g transform="translate(238,98)"><circle cx="13" cy="13" r="12" fill="none" stroke="#f0857c" stroke-width="2"/><path d="M13 4 L20 20 L6 20 Z" fill="#f0857c" fill-opacity="0.5"/></g>
  <text class="lbl" x="278" y="104">Tetragon</text>
  <text class="lbl" x="278" y="121">eBPF in kernel</text>

  <!-- node 3: events + policies -->
  <rect x="416" y="76" width="150" height="68" rx="12" fill="#161d2c" stroke="#5a4a12" stroke-width="1.4"/>
  <g transform="translate(434,100)" fill="#f6cf6a"><circle cx="6" cy="8" r="4"/><circle cx="6" cy="20" r="4"/><rect x="16" y="4" width="18" height="6" rx="3"/><rect x="16" y="16" width="14" height="6" rx="3"/></g>
  <text class="lbl" x="474" y="104">Events</text>
  <text class="lbl" x="474" y="121">policy flags</text>

  <!-- output: threat map -->
  <rect x="620" y="62" width="196" height="96" rx="12" fill="#161d2c" stroke="#123a26" stroke-width="1.4"/>
  <g transform="translate(640,84)">
    <circle cx="14" cy="14" r="13" fill="none" stroke="#7ee2a8" stroke-width="1.6"/>
    <line x1="14" y1="14" x2="24" y2="7" stroke="#7ee2a8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="20" cy="8" r="2.5" fill="#ea4335"/>
  </g>
  <text class="lbl" x="712" y="92">Threat map</text>
  <text class="sub" x="712" y="110">top binaries,</text>
  <text class="sub" x="712" y="126">flags, alerts</text>

  <!-- arrows -->
  <line x1="180" y1="110" x2="214" y2="110" stroke="#5b6b86" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="376" y1="110" x2="410" y2="110" stroke="#5b6b86" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="566" y1="110" x2="614" y2="110" stroke="#5b6b86" stroke-width="2" marker-end="url(#arrow)"/>

  <text class="sub" x="102" y="164" text-anchor="middle">every process</text>
  <text class="sub" x="298" y="164" text-anchor="middle">near zero overhead</text>
  <text class="sub" x="491" y="164" text-anchor="middle">exec, connect, read</text>
</svg>
