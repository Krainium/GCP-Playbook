apiVersion: v1
kind: Namespace
metadata: {name: demo}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victim
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: victim}
  template:
    metadata:
      labels: {app: victim}
    spec:
      containers:
      - name: victim
        image: ubuntu:24.04
        command: ["/bin/sh","-c","apt-get update -qq >/dev/null 2>&1; apt-get install -y -qq curl >/dev/null 2>&1; sleep infinity"]
        resources:
          requests: {cpu: 50m, memory: 32Mi}
