grafana:
  adminPassword: "lgtm"
  service: {type: ClusterIP}
  # wire the LGTM data sources into Grafana up front
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki-gateway.lgtm.svc
      access: proxy
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo.lgtm.svc:3200
      access: proxy
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
    - name: Pyroscope
      type: grafana-pyroscope-datasource
      uid: pyroscope
      url: http://pyroscope.lgtm.svc:4040
      access: proxy
prometheus:
  prometheusSpec:
    retention: 2h
    serviceMonitorSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 150m, memory: 512Mi}
      limits: {memory: 1Gi}
alertmanager: {enabled: false}
prometheus-node-exporter:
  resources:
    requests: {cpu: 20m, memory: 24Mi}
