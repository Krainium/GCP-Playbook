<svg xmlns="http://www.w3.org/2000/svg" width="880" height="180" viewBox="0 0 880 180" role="img" aria-label="Self Hosted LGTM Stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4285F4"/>
      <stop offset="0.5" stop-color="#34A853"/>
      <stop offset="1" stop-color="#FBBC05"/>
    </linearGradient>
  </defs>
  <rect width="880" height="180" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="7" height="180" rx="3.5" fill="url(#bar)"/>

  <!-- emblem: four signal streams converging into one pane -->
  <g transform="translate(40,44)">
    <path d="M4 12 C 40 12, 40 46, 84 46" fill="none" stroke="#8ab4f8" stroke-width="3" stroke-linecap="round"/>
    <path d="M4 34 C 40 34, 40 46, 84 46" fill="none" stroke="#7ee2a8" stroke-width="3" stroke-linecap="round"/>
    <path d="M4 58 C 40 58, 40 46, 84 46" fill="none" stroke="#f6cf6a" stroke-width="3" stroke-linecap="round"/>
    <path d="M4 80 C 40 80, 40 46, 84 46" fill="none" stroke="#f0857c" stroke-width="3" stroke-linecap="round"/>
    <rect x="82" y="26" width="40" height="40" rx="8" fill="#161d2c" stroke="#FBBC05" stroke-width="2.5"/>
    <circle cx="102" cy="46" r="8" fill="none" stroke="#f6cf6a" stroke-width="3"/>
    <circle cx="102" cy="46" r="2.5" fill="#f6cf6a"/>
  </g>

  <text x="150" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#e8eef7">Self Hosted LGTM</text>
  <text x="151" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" fill="#9aa7ba">Logs, metrics, traces, and profiles in one open source pane.</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">
    <rect x="151" y="120" width="60" height="28" rx="14" fill="#12305e" stroke="#4285F4" stroke-width="1.1"/>
    <text x="181" y="138.5" fill="#a9c7fb" text-anchor="middle">Loki</text>
    <rect x="219" y="120" width="66" height="28" rx="14" fill="#123a26" stroke="#34A853" stroke-width="1.1"/>
    <text x="252" y="138.5" fill="#93e6b6" text-anchor="middle">Tempo</text>
    <rect x="293" y="120" width="66" height="28" rx="14" fill="#3a2a12" stroke="#FBBC05" stroke-width="1.1"/>
    <text x="326" y="138.5" fill="#f2d488" text-anchor="middle">Mimir</text>
    <rect x="367" y="120" width="92" height="28" rx="14" fill="#3a1414" stroke="#ea4335" stroke-width="1.1"/>
    <text x="413" y="138.5" fill="#f4a49d" text-anchor="middle">Pyroscope</text>
    <rect x="467" y="120" width="60" height="28" rx="14" fill="#1c2333" stroke="#5a6b86" stroke-width="1.1"/>
    <text x="497" y="138.5" fill="#c9d5e6" text-anchor="middle">Alloy</text>
  </g>
</svg>
