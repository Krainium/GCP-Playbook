<svg xmlns="http://www.w3.org/2000/svg" width="840" height="230" viewBox="0 0 840 230" role="img" aria-label="Flow from four signals through Alloy and the LGTM backends to one Grafana pane">
  <defs>
    <style>
      .lbl{font-family:Segoe UI,Helvetica,Arial,sans-serif;fill:#e8eef7;font-weight:600;font-size:13.5px}
      .sub{font-family:Segoe UI,Helvetica,Arial,sans-serif;fill:#93a1b5;font-size:11px}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5b6b86"/>
    </marker>
  </defs>
  <rect width="840" height="230" rx="16" fill="#0d1420"/>

  <!-- four signals -->
  <g font-family="Segoe UI,Arial" font-size="12" font-weight="600">
    <rect x="24" y="24" width="120" height="34" rx="8" fill="#161d2c" stroke="#1c3a63"/><text class="lbl" x="40" y="45">logs</text>
    <rect x="24" y="68" width="120" height="34" rx="8" fill="#161d2c" stroke="#173f2a"/><text class="lbl" x="40" y="89">metrics</text>
    <rect x="24" y="112" width="120" height="34" rx="8" fill="#161d2c" stroke="#5a4a12"/><text class="lbl" x="40" y="133">traces</text>
    <rect x="24" y="156" width="120" height="34" rx="8" fill="#161d2c" stroke="#5a1f22"/><text class="lbl" x="40" y="177">profiles</text>
  </g>

  <!-- Alloy collector -->
  <rect x="220" y="82" width="150" height="66" rx="12" fill="#161d2c" stroke="#5a6b86" stroke-width="1.4"/>
  <g transform="translate(238,104)" fill="none" stroke="#c9d5e6" stroke-width="2"><path d="M0 10 h6 M0 16 h6 M0 22 h6"/><rect x="12" y="6" width="18" height="20" rx="3"/></g>
  <text class="lbl" x="286" y="110">Alloy</text>
  <text class="lbl" x="286" y="127">one collector</text>

  <!-- LGTM backends -->
  <rect x="416" y="82" width="150" height="66" rx="12" fill="#161d2c" stroke="#3a2a12" stroke-width="1.4"/>
  <text class="lbl" x="491" y="108" text-anchor="middle">Loki Tempo</text>
  <text class="lbl" x="491" y="126" text-anchor="middle">Mimir Pyroscope</text>

  <!-- one pane -->
  <rect x="620" y="72" width="196" height="86" rx="12" fill="#161d2c" stroke="#FBBC05" stroke-width="1.4"/>
  <g transform="translate(638,92)"><rect x="0" y="0" width="24" height="24" rx="5" fill="none" stroke="#f6cf6a" stroke-width="2"/><circle cx="12" cy="12" r="6" fill="none" stroke="#f6cf6a" stroke-width="2"/></g>
  <text class="lbl" x="676" y="102">One Grafana pane</text>
  <text class="sub" x="676" y="120">correlate all four,</text>
  <text class="sub" x="676" y="135">trace to logs in a click</text>

  <!-- arrows: four signals to Alloy -->
  <path d="M144 41 H186 V108 H214" fill="none" stroke="#5b6b86" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M144 85 H186 V112 H214" fill="none" stroke="#5b6b86" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M144 129 H186 V118 H214" fill="none" stroke="#5b6b86" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M144 173 H186 V122 H214" fill="none" stroke="#5b6b86" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="370" y1="115" x2="410" y2="115" stroke="#5b6b86" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="566" y1="115" x2="614" y2="115" stroke="#5b6b86" stroke-width="2" marker-end="url(#arrow)"/>

  <text class="sub" x="490" y="170" text-anchor="middle">store on GCS, cheap retention</text>
</svg>
