<svg xmlns="http://www.w3.org/2000/svg" width="840" height="220" viewBox="0 0 840 220" role="img" aria-label="Flow from an uninstrumented app through Beyla eBPF to RED metrics on Grafana">
  <defs>
    <style>
      .lbl{font-family:Segoe UI,Helvetica,Arial,sans-serif;fill:#e8eef7;font-weight:600;font-size:14px}
      .sub{font-family:Segoe UI,Helvetica,Arial,sans-serif;fill:#93a1b5;font-size:11.5px}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5b6b86"/>
    </marker>
  </defs>
  <rect width="840" height="220" rx="16" fill="#0d1420"/>

  <!-- node 1: app, no metrics -->
  <rect x="24" y="76" width="156" height="68" rx="12" fill="#161d2c" stroke="#0e4d6b" stroke-width="1.4"/>
  <g transform="translate(44,100)" fill="none" stroke="#8ab4f8" stroke-width="2"><rect x="0" y="2" width="24" height="20" rx="3"/></g>
  <text class="lbl" x="82" y="104">Any app</text>
  <text class="lbl" x="82" y="121">no metrics</text>

  <!-- node 2: kernel / eBPF -->
  <rect x="220" y="76" width="156" height="68" rx="12" fill="#161d2c" stroke="#173f2a" stroke-width="1.4"/>
  <g transform="translate(238,98)" fill="none" stroke="#7ee2a8" stroke-width="2">
    <rect x="0" y="0" width="26" height="26" rx="4"/><path d="M6 8 h14 M6 13 h14 M6 18 h9" stroke-linecap="round"/>
  </g>
  <text class="lbl" x="278" y="104">Beyla eBPF</text>
  <text class="lbl" x="278" y="121">in the kernel</text>

  <!-- node 3: RED metrics -->
  <rect x="416" y="76" width="150" height="68" rx="12" fill="#161d2c" stroke="#5a4a12" stroke-width="1.4"/>
  <g transform="translate(434,100)" fill="#f6cf6a"><circle cx="6" cy="14" r="5"/><circle cx="18" cy="14" r="5"/><circle cx="30" cy="14" r="5"/></g>
  <text class="lbl" x="474" y="104">RED metrics</text>
  <text class="lbl" x="474" y="121">rate err dur</text>

  <!-- output: grafana -->
  <rect x="620" y="76" width="196" height="68" rx="12" fill="#161d2c" stroke="#123a26" stroke-width="1.4"/>
  <g transform="translate(638,96)" fill="none" stroke="#7ee2a8" stroke-width="2">
    <path d="M0 26 V0 M0 26 H26" stroke-linecap="round"/><path d="M2 20 l6 -6 l5 4 l9 -12" stroke="#f6cf6a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="lbl" x="676" y="106">Grafana</text>
  <text class="sub" x="676" y="124">golden signals</text>

  <!-- arrows -->
  <line x1="180" y1="110" x2="214" y2="110" stroke="#5b6b86" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="376" y1="110" x2="410" y2="110" stroke="#5b6b86" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="566" y1="110" x2="614" y2="110" stroke="#5b6b86" stroke-width="2" marker-end="url(#arrow)"/>

  <text class="sub" x="102" y="164" text-anchor="middle">no sidecar, no SDK</text>
  <text class="sub" x="298" y="164" text-anchor="middle">watches syscalls</text>
  <text class="sub" x="491" y="164" text-anchor="middle">per route, per status</text>
</svg>
