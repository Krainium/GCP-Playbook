<svg xmlns="http://www.w3.org/2000/svg" width="880" height="180" viewBox="0 0 880 180" role="img" aria-label="Kubernetes FinOps Cockpit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4285F4"/>
      <stop offset="0.5" stop-color="#34A853"/>
      <stop offset="1" stop-color="#FBBC05"/>
    </linearGradient>
  </defs>
  <rect width="880" height="180" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="7" height="180" rx="3.5" fill="url(#bar)"/>

  <!-- emblem: cost bars rising into a dollar gauge -->
  <g transform="translate(44,44)">
    <g>
      <rect x="4"  y="60" width="15" height="32" rx="3" fill="#34A853"/>
      <rect x="24" y="46" width="15" height="46" rx="3" fill="#FBBC05"/>
      <rect x="44" y="26" width="15" height="66" rx="3" fill="#ea4335"/>
    </g>
    <!-- dollar coin -->
    <circle cx="80" cy="30" r="18" fill="#161d2c" stroke="#FBBC05" stroke-width="3"/>
    <text x="80" y="37" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f6cf6a" text-anchor="middle">$</text>
  </g>

  <text x="150" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#e8eef7">FinOps Cockpit</text>
  <text x="151" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" fill="#9aa7ba">Turn cluster cost into a live signal, per team, per namespace.</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="151" y="120" width="92" height="30" rx="15" fill="#123a26" stroke="#34A853" stroke-width="1.2"/>
    <circle cx="169" cy="135" r="4" fill="#7ee2a8"/>
    <text x="201" y="139.5" fill="#93e6b6" text-anchor="middle">OpenCost</text>
    <rect x="253" y="120" width="116" height="30" rx="15" fill="#12305e" stroke="#4285F4" stroke-width="1.2"/>
    <circle cx="273" cy="135" r="4" fill="#8ab4f8"/>
    <text x="315" y="139.5" fill="#a9c7fb" text-anchor="middle">Prometheus</text>
    <rect x="379" y="120" width="96" height="30" rx="15" fill="#3a2a12" stroke="#FBBC05" stroke-width="1.2"/>
    <circle cx="397" cy="135" r="4" fill="#f6cf6a"/>
    <text x="435" y="139.5" fill="#f2d488" text-anchor="middle">Grafana</text>
  </g>
</svg>
