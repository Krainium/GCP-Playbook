<svg xmlns="http://www.w3.org/2000/svg" width="840" height="220" viewBox="0 0 840 220" role="img" aria-label="Flow from a chaos experiment to a degraded target to a burning error budget">
  <defs>
    <style>
      .lbl{font-family:Segoe UI,Helvetica,Arial,sans-serif;fill:#e8eef7;font-weight:600;font-size:14px}
      .sub{font-family:Segoe UI,Helvetica,Arial,sans-serif;fill:#93a1b5;font-size:11.5px}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5b6b86"/>
    </marker>
  </defs>
  <rect width="840" height="220" rx="16" fill="#0d1420"/>

  <!-- node 1: chaos experiment -->
  <rect x="24" y="76" width="156" height="68" rx="12" fill="#161d2c" stroke="#5a1f22" stroke-width="1.4"/>
  <g transform="translate(46,98)" stroke="#f0857c" stroke-width="2.6" stroke-linecap="round">
    <line x1="10" y1="0" x2="10" y2="9"/><line x1="22" y1="4" x2="15" y2="10"/><line x1="-2" y1="4" x2="5" y2="10"/>
    <line x1="24" y1="16" x2="15" y2="16"/><line x1="-4" y1="16" x2="5" y2="16"/><line x1="18" y1="26" x2="13" y2="19"/><line x1="2" y1="26" x2="7" y2="19"/>
  </g>
  <text class="lbl" x="82" y="106">Inject fault</text>
  <text class="lbl" x="82" y="123">pod, network</text>

  <!-- node 2: target degrades -->
  <rect x="220" y="76" width="150" height="68" rx="12" fill="#161d2c" stroke="#0e4d6b" stroke-width="1.4"/>
  <g transform="translate(238,100)" fill="#8ab4f8">
    <rect x="0" y="4" width="12" height="16" rx="2"/><rect x="16" y="4" width="12" height="16" rx="2" fill-opacity="0.35"/><rect x="32" y="4" width="12" height="16" rx="2"/>
  </g>
  <text class="lbl" x="278" y="106">Target</text>
  <text class="lbl" x="278" y="123">degrades</text>

  <!-- node 3: SLO metric -->
  <rect x="410" y="76" width="150" height="68" rx="12" fill="#161d2c" stroke="#1c3a63" stroke-width="1.4"/>
  <g transform="translate(428,100)" fill="none" stroke="#7ee2a8" stroke-width="2.2">
    <path d="M0 22 V0 M0 22 H24" stroke-linecap="round"/>
    <path d="M2 6 h6 l4 12 l4 -12 h6" stroke="#f0857c" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="lbl" x="468" y="106">SLO dips</text>
  <text class="lbl" x="468" y="123">on the board</text>

  <!-- output: budget burns -->
  <rect x="620" y="62" width="196" height="96" rx="12" fill="#161d2c" stroke="#5a1f22" stroke-width="1.4"/>
  <g transform="translate(640,88)" fill="none" stroke="#f0857c" stroke-width="2.4">
    <path d="M8 30 C -2 18, 14 12, 8 0 C 20 10, 22 24, 8 30 Z" fill="#ea4335" fill-opacity="0.4"/>
  </g>
  <text class="lbl" x="712" y="96">Error budget</text>
  <text class="lbl" x="712" y="114">burns</text>
  <text class="sub" x="712" y="132">did the alert fire?</text>

  <!-- arrows -->
  <line x1="180" y1="110" x2="214" y2="110" stroke="#5b6b86" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="370" y1="110" x2="404" y2="110" stroke="#5b6b86" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="110" x2="614" y2="110" stroke="#5b6b86" stroke-width="2" marker-end="url(#arrow)"/>

  <text class="sub" x="102" y="164" text-anchor="middle">on a schedule</text>
  <text class="sub" x="295" y="164" text-anchor="middle">measured</text>
  <text class="sub" x="485" y="164" text-anchor="middle">availability drops</text>
</svg>
