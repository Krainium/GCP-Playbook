<svg xmlns="http://www.w3.org/2000/svg" width="880" height="180" viewBox="0 0 880 180" role="img" aria-label="Chaos SLO Arena on GKE">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4285F4"/>
      <stop offset="0.5" stop-color="#34A853"/>
      <stop offset="1" stop-color="#FBBC05"/>
    </linearGradient>
  </defs>
  <rect width="880" height="180" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="7" height="180" rx="3.5" fill="url(#bar)"/>

  <!-- emblem: an availability line that gets struck and dips, error budget burning -->
  <g transform="translate(40,44)">
    <!-- burst -->
    <g transform="translate(46,10)" stroke="#ea4335" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-12" x2="0" y2="-2"/><line x1="12" y1="-8" x2="6" y2="0"/>
      <line x1="-12" y1="-8" x2="-6" y2="0"/><line x1="14" y1="4" x2="6" y2="4"/><line x1="-14" y1="4" x2="-6" y2="4"/>
    </g>
    <!-- availability line dipping then recovering -->
    <path d="M4 40 H36 L44 78 L60 78 L68 40 H96" fill="none" stroke="#34A853" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- burn fill under the dip -->
    <path d="M36 40 L44 78 L60 78 L68 40 Z" fill="#ea4335" fill-opacity="0.35"/>
  </g>

  <text x="150" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="31" font-weight="700" fill="#e8eef7">Chaos SLO Arena</text>
  <text x="151" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" fill="#9aa7ba">Break the cluster on purpose and watch the error budget burn.</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="151" y="120" width="118" height="30" rx="15" fill="#3a1414" stroke="#ea4335" stroke-width="1.2"/>
    <circle cx="171" cy="135" r="4" fill="#f0857c"/>
    <text x="215" y="139.5" fill="#f4a49d" text-anchor="middle">Chaos Mesh</text>
    <rect x="279" y="120" width="116" height="30" rx="15" fill="#12305e" stroke="#4285F4" stroke-width="1.2"/>
    <circle cx="299" cy="135" r="4" fill="#8ab4f8"/>
    <text x="341" y="139.5" fill="#a9c7fb" text-anchor="middle">Prometheus</text>
    <rect x="405" y="120" width="96" height="30" rx="15" fill="#123a26" stroke="#34A853" stroke-width="1.2"/>
    <circle cx="425" cy="135" r="4" fill="#7ee2a8"/>
    <text x="461" y="139.5" fill="#93e6b6" text-anchor="middle">Grafana</text>
  </g>
</svg>
