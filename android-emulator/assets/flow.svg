<svg xmlns="http://www.w3.org/2000/svg" width="840" height="220" viewBox="0 0 840 220" role="img" aria-label="Flow from service account key to a Linux VM with KVM to the Android emulator to VNC and RDP">
  <defs>
    <style>
      .lbl{font-family:Segoe UI,Helvetica,Arial,sans-serif;fill:#e8eef7;font-weight:600;font-size:14px}
      .sub{font-family:Segoe UI,Helvetica,Arial,sans-serif;fill:#93a1b5;font-size:11.5px}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5b6b86"/>
    </marker>
  </defs>
  <rect width="840" height="220" rx="16" fill="#0d1420"/>

  <!-- node 1: key -->
  <rect x="24" y="76" width="156" height="68" rx="12" fill="#161d2c" stroke="#5a4a12" stroke-width="1.4"/>
  <g transform="translate(44,102)" stroke="#FBBC05" stroke-width="2.4" fill="none">
    <circle cx="7" cy="7" r="6"/><path d="M12 10 L26 24 M22 20 l4 -4 M18 24 l4 -4" stroke-linecap="round"/>
  </g>
  <text class="lbl" x="82" y="106">Service</text>
  <text class="lbl" x="82" y="123">account key</text>

  <!-- node 2: linux vm with kvm -->
  <rect x="238" y="76" width="156" height="68" rx="12" fill="#161d2c" stroke="#173f2a" stroke-width="1.4"/>
  <g transform="translate(256,98)" fill="none" stroke="#7ee2a8" stroke-width="2" stroke-linecap="round">
    <rect x="2" y="2" width="18" height="18" rx="2.5"/><rect x="7" y="7" width="8" height="8" rx="1"/>
    <path d="M7 2 v-3 M15 2 v-3 M7 20 v3 M15 20 v3 M2 7 h-3 M2 15 h-3 M20 7 h3 M20 15 h3"/>
  </g>
  <text class="lbl" x="298" y="106">Linux VM</text>
  <text class="lbl" x="298" y="123">nested virt</text>

  <!-- node 3: android emulator -->
  <rect x="452" y="76" width="156" height="68" rx="12" fill="#161d2c" stroke="#1c4a2e" stroke-width="1.4"/>
  <g transform="translate(470,98)">
    <path d="M0 20 a12 12 0 0 1 24 0 z" fill="#3DDC84"/>
    <g stroke="#3DDC84" stroke-width="1.6" stroke-linecap="round"><path d="M4 2 l3 5 M20 2 l-3 5"/></g>
    <circle cx="7.5" cy="14" r="1.4" fill="#0b1220"/><circle cx="16.5" cy="14" r="1.4" fill="#0b1220"/>
  </g>
  <text class="lbl" x="512" y="106">Android 9</text>
  <text class="lbl" x="512" y="123">emulator</text>

  <!-- outputs -->
  <rect x="668" y="40" width="150" height="56" rx="12" fill="#161d2c" stroke="#173f2a" stroke-width="1.4"/>
  <g transform="translate(686,56)" stroke="#7ee2a8" stroke-width="2" fill="none"><rect x="0" y="0" width="26" height="18" rx="2"/><circle cx="13" cy="9" r="3.4"/></g>
  <text class="lbl" x="724" y="63">VNC</text>
  <text class="sub" x="724" y="80">port 5900</text>

  <rect x="668" y="124" width="150" height="56" rx="12" fill="#161d2c" stroke="#1c3a63" stroke-width="1.4"/>
  <g transform="translate(686,140)" stroke="#8ab4f8" stroke-width="2" fill="none"><rect x="0" y="0" width="26" height="18" rx="2"/><path d="M9 22 h8 M13 18 v4" stroke-linecap="round"/></g>
  <text class="lbl" x="724" y="147">RDP</text>
  <text class="sub" x="724" y="164">port 3389</text>

  <!-- arrows -->
  <line x1="180" y1="110" x2="232" y2="110" stroke="#5b6b86" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="394" y1="110" x2="446" y2="110" stroke="#5b6b86" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M608 110 H636 V68 H662" fill="none" stroke="#5b6b86" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M608 110 H636 V152 H662" fill="none" stroke="#5b6b86" stroke-width="2" marker-end="url(#arrow)"/>

  <text class="sub" x="102" y="164" text-anchor="middle">key file only</text>
  <text class="sub" x="316" y="164" text-anchor="middle">Intel, KVM on</text>
  <text class="sub" x="530" y="164" text-anchor="middle">boots the AVD</text>
</svg>
