      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101d18"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3DDC84"/>
      <stop offset="1" stop-color="#4285F4"/>
