<svg xmlns="http://www.w3.org/2000/svg" width="400" height="680" viewBox="0 0 400 680" role="img" aria-label="Android 9 Pie home screen">
  <defs>
    <linearGradient id="pie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6b3c1"/>
      <stop offset="0.5" stop-color="#c77fa0"/>
      <stop offset="1" stop-color="#3a2f4a"/>
    </linearGradient>
  </defs>
  <!-- phone body -->
  <rect x="1" y="1" width="398" height="678" rx="30" fill="#0a0a0e" stroke="#20242e" stroke-width="1.4"/>
  <!-- screen -->
  <clipPath id="scr"><rect x="12" y="14" width="376" height="652" rx="20"/></clipPath>
  <g clip-path="url(#scr)">
    <rect x="12" y="14" width="376" height="652" fill="url(#pie)"/>
    <path d="M12 540 L110 486 L190 520 L270 476 L340 512 L388 486 L388 666 L12 666 Z" fill="#2b2438" opacity="0.92"/>

    <!-- status bar -->
    <text x="30" y="46" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#ffffff" font-weight="600">6:25</text>
    <g transform="translate(320,36)" fill="#ffffff">
      <path d="M0 10 L10 0 L10 10 Z"/><path d="M14 3 h9 v7 h-9 z" opacity="0.9"/><rect x="27" y="2" width="16" height="9" rx="2" fill="none" stroke="#fff" stroke-width="1.4"/><rect x="29" y="4" width="10" height="5" fill="#fff"/>
    </g>

    <!-- clock widget -->
    <text x="200" y="120" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="500">Saturday, Aug 8</text>

    <!-- google search pill -->
    <rect x="60" y="470" width="280" height="44" rx="22" fill="#ffffff" opacity="0.95"/>
    <text x="90" y="497" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#4285F4">G</text>
    <circle cx="316" cy="492" r="6" fill="none" stroke="#4285F4" stroke-width="2"/>
    <circle cx="316" cy="492" r="2" fill="#EA4335"/>

    <!-- dock -->
    <g>
      <!-- phone -->
      <circle cx="80" cy="586" r="24" fill="#2f6fed"/>
      <path d="M72 578 a10 10 0 0 0 16 16 l-4 -4 a4 4 0 0 1 -8 -8 z" fill="#ffffff"/>
      <!-- messages -->
      <circle cx="146" cy="586" r="24" fill="#2f8be6"/>
      <path d="M135 579 h22 v12 h-14 l-8 6 v-6 h0 z" fill="#ffffff"/>
      <!-- play store -->
      <circle cx="254" cy="586" r="24" fill="#ffffff"/>
      <path d="M247 575 L268 586 L247 597 Z" fill="#34A853"/>
      <path d="M247 575 L258 580.5 L247 586 Z" fill="#FBBC05"/>
      <path d="M247 586 L258 591.5 L247 597 Z" fill="#EA4335"/>
      <!-- chrome -->
      <circle cx="320" cy="586" r="24" fill="#ffffff"/>
      <circle cx="320" cy="586" r="14" fill="#4285F4"/><circle cx="320" cy="586" r="6" fill="#ffffff"/>
    </g>
  </g>

  <!-- nav bar -->
  <g stroke="#e6edf3" stroke-width="2" fill="none">
    <path d="M150 648 l-9 -9 l9 -9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="200" cy="639" r="9"/>
    <rect x="242" y="630" width="18" height="18" rx="2"/>
  </g>
</svg>
