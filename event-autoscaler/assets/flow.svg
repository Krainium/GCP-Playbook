<svg xmlns="http://www.w3.org/2000/svg" width="840" height="220" viewBox="0 0 840 220" role="img" aria-label="Flow from a demand metric through KEDA to scaled pods">
  <defs>
    <style>
      .lbl{font-family:Segoe UI,Helvetica,Arial,sans-serif;fill:#e8eef7;font-weight:600;font-size:14px}
      .sub{font-family:Segoe UI,Helvetica,Arial,sans-serif;fill:#93a1b5;font-size:11.5px}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5b6b86"/>
    </marker>
  </defs>
  <rect width="840" height="220" rx="16" fill="#0d1420"/>

  <!-- node 1: demand metric -->
  <rect x="24" y="76" width="156" height="68" rx="12" fill="#161d2c" stroke="#5a4a12" stroke-width="1.4"/>
  <path d="M42 122 l10 -6 l9 2 l10 -14 l14 -4" fill="none" stroke="#FBBC05" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="lbl" x="82" y="104">Demand</text>
  <text class="lbl" x="82" y="121">request rate</text>

  <!-- node 2: prometheus -->
  <rect x="220" y="76" width="150" height="68" rx="12" fill="#161d2c" stroke="#1c3a63" stroke-width="1.4"/>
  <g transform="translate(238,100)" fill="#e8703a"><circle cx="12" cy="12" r="11"/><rect x="9" y="1" width="6" height="10" rx="3" fill="#161d2c"/></g>
  <text class="lbl" x="278" y="106">Prometheus</text>
  <text class="lbl" x="278" y="123">stores it</text>

  <!-- node 3: KEDA -->
  <rect x="410" y="76" width="150" height="68" rx="12" fill="#161d2c" stroke="#173f2a" stroke-width="1.4"/>
  <g transform="translate(428,100)" fill="none" stroke="#7ee2a8" stroke-width="2.2">
    <circle cx="12" cy="12" r="10"/><path d="M12 6 v6 l4 3" stroke-linecap="round"/>
  </g>
  <text class="lbl" x="468" y="106">KEDA</text>
  <text class="lbl" x="468" y="123">reads and decides</text>

  <!-- output: pods scale -->
  <rect x="620" y="62" width="196" height="96" rx="12" fill="#161d2c" stroke="#123a26" stroke-width="1.4"/>
  <g transform="translate(640,92)" fill="#34A853">
    <rect x="0"  y="30" width="12" height="12" rx="2"/>
    <rect x="16" y="20" width="12" height="22" rx="2"/>
    <rect x="32" y="10" width="12" height="32" rx="2"/>
    <rect x="48" y="0"  width="12" height="42" rx="2"/>
  </g>
  <text class="lbl" x="712" y="98">Pods scale</text>
  <text class="sub" x="712" y="116">up on load,</text>
  <text class="sub" x="712" y="132">down when it clears</text>

  <!-- arrows -->
  <line x1="180" y1="110" x2="214" y2="110" stroke="#5b6b86" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="370" y1="110" x2="404" y2="110" stroke="#5b6b86" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="110" x2="614" y2="110" stroke="#5b6b86" stroke-width="2" marker-end="url(#arrow)"/>

  <text class="sub" x="102" y="164" text-anchor="middle">any business metric</text>
  <text class="sub" x="295" y="164" text-anchor="middle">scraped</text>
  <text class="sub" x="485" y="164" text-anchor="middle">query vs threshold</text>
</svg>
