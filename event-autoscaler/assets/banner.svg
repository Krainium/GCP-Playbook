<svg xmlns="http://www.w3.org/2000/svg" width="880" height="180" viewBox="0 0 880 180" role="img" aria-label="Event Autoscaler on GKE">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4285F4"/>
      <stop offset="0.5" stop-color="#34A853"/>
      <stop offset="1" stop-color="#FBBC05"/>
    </linearGradient>
  </defs>
  <rect width="880" height="180" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="7" height="180" rx="3.5" fill="url(#bar)"/>

  <!-- emblem: a demand curve above pods that grow in step with it -->
  <g transform="translate(40,40)">
    <path d="M6 40 L26 32 L44 34 L64 16 L92 10" fill="none" stroke="#FBBC05" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#34A853">
      <rect x="6"  y="78" width="14" height="14" rx="3"/>
      <rect x="26" y="66" width="14" height="26" rx="3"/>
      <rect x="46" y="54" width="14" height="38" rx="3"/>
      <rect x="66" y="42" width="14" height="50" rx="3"/>
      <rect x="86" y="30" width="14" height="62" rx="3"/>
    </g>
  </g>

  <text x="150" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="31" font-weight="700" fill="#e8eef7">Event Autoscaler</text>
  <text x="151" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" fill="#9aa7ba">Pods breathe with demand, scaled by the metric on your dashboard.</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="151" y="120" width="80" height="30" rx="15" fill="#123a26" stroke="#34A853" stroke-width="1.2"/>
    <circle cx="171" cy="135" r="4" fill="#7ee2a8"/>
    <text x="199" y="139.5" fill="#93e6b6" text-anchor="middle">KEDA</text>
    <rect x="241" y="120" width="116" height="30" rx="15" fill="#12305e" stroke="#4285F4" stroke-width="1.2"/>
    <circle cx="261" cy="135" r="4" fill="#8ab4f8"/>
    <text x="303" y="139.5" fill="#a9c7fb" text-anchor="middle">Prometheus</text>
    <rect x="367" y="120" width="96" height="30" rx="15" fill="#3a2a12" stroke="#FBBC05" stroke-width="1.2"/>
    <circle cx="387" cy="135" r="4" fill="#f6cf6a"/>
    <text x="423" y="139.5" fill="#f2d488" text-anchor="middle">Grafana</text>
  </g>
</svg>
