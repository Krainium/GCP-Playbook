<svg xmlns="http://www.w3.org/2000/svg" width="880" height="180" viewBox="0 0 880 180" role="img" aria-label="GCP Windows RDP and SSH Setup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4285F4"/>
      <stop offset="0.5" stop-color="#34A853"/>
      <stop offset="1" stop-color="#FBBC05"/>
    </linearGradient>
  </defs>
  <rect width="880" height="180" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="7" height="180" rx="3.5" fill="url(#bar)"/>

  <!-- emblem: cloud + windows squares -->
  <g transform="translate(44,50)">
    <g fill="#4285F4">
      <circle cx="26" cy="44" r="16"/>
      <circle cx="48" cy="34" r="22"/>
      <circle cx="72" cy="46" r="15"/>
      <rect x="18" y="46" width="60" height="18" rx="9"/>
    </g>
    <g transform="translate(30,4)">
      <rect x="0" y="0" width="12" height="12" rx="1.5" fill="#00A4EF"/>
      <rect x="14" y="0" width="12" height="12" rx="1.5" fill="#00A4EF"/>
      <rect x="0" y="14" width="12" height="12" rx="1.5" fill="#00A4EF"/>
      <rect x="14" y="14" width="12" height="12" rx="1.5" fill="#00A4EF"/>
    </g>
  </g>

  <text x="150" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="31" font-weight="700" fill="#e8eef7">GCP Windows RDP and SSH Setup</text>
  <text x="151" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" fill="#9aa7ba">Create a Windows VM, connect over RDP, then add SSH. One key file, no account login.</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="151" y="120" width="112" height="30" rx="15" fill="#12305e" stroke="#4285F4" stroke-width="1.2"/>
    <circle cx="171" cy="135" r="4" fill="#8ab4f8"/>
    <text x="212" y="139.5" fill="#a9c7fb" text-anchor="middle">RDP 3389</text>
    <rect x="273" y="120" width="100" height="30" rx="15" fill="#123a26" stroke="#34A853" stroke-width="1.2"/>
    <circle cx="293" cy="135" r="4" fill="#7ee2a8"/>
    <text x="330" y="139.5" fill="#93e6b6" text-anchor="middle">SSH 22</text>
  </g>
</svg>
